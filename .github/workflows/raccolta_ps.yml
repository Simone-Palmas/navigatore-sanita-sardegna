name: Raccolta dati pronto soccorso

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raccolta-ps
  cancel-in-progress: true

jobs:
  raccolta:
    runs-on: self-hosted
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Esegui lo script
        run: python scripts/raccolta_ps.py

      - name: Salva i dati nel repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Dati PS $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
